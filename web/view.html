<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>LanShare</title><link rel="preload" href="/web/dm-sans.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/web/app.css">
<style>
:root{--bg:#000;--surface:#161a17;--fg:#f2f5f2;--mut:#a9b3ad;--line:#2a322c;--acc:#22c55e;--acc-h:#4ade80;--on-acc:#04210f;--sunken:#1d221e}
body{background:#000;overflow:hidden;height:100vh;height:100dvh}
video{width:100vw;height:100vh;height:100dvh;object-fit:contain;display:block;background:#000}
.state{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.state .box{max-width:420px}.state .ico{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:#14301f;color:#86efac}.state h1{font-size:22px;margin-bottom:6px}.state p{color:var(--mut)}
.state .acts{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar{position:fixed;left:50%;transform:translate(-50%,0);bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:rgba(22,26,23,.88);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:8px;transition:opacity .25s,transform .25s var(--ease)}
.bar.off{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.bar .btn{background:transparent;color:var(--fg);border:0;min-height:44px}.bar .btn:hover{background:#ffffff1a}.bar .btn[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.bar .sep{width:1px;height:26px;background:var(--line)}.stats{font-size:13px;color:var(--mut);padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
body.ctl video{touch-action:none;cursor:default}
.bar.compact{left:auto;right:max(14px,env(safe-area-inset-right));transform:none;padding:6px}.bar.compact.off{transform:none;opacity:1;pointer-events:auto}
.bar.compact .stats,.bar.compact .sep,.bar.compact .hlp{display:none}.bar.compact .btn span{display:none}.bar.compact .btn{padding:0 12px}
#ctl[aria-pressed=true]{background:var(--warn)!important;color:#111!important}
.kbp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 70px);width:min(92vw,420px);background:rgba(22,26,23,.95);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center}
.kbp input{flex:1;min-width:0;font:500 16px var(--font);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e110f;color:var(--fg);min-height:44px}
.toast{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(22,26,23,.95);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;gap:8px;align-items:center;max-width:92vw;z-index:30}
.ctlhint{position:fixed;left:14px;top:14px;background:var(--warn);color:#111;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
@media(max-width:560px){.bar .btn span{display:none}.bar .btn{padding:0 14px}}
</style></head><body>
<div id="live-msg" class="sr" role="status" aria-live="polite"></div>
<video id="v" autoplay muted playsinline aria-label="Écran partagé"></video>
<div class="state" id="st" role="status"><div class="box"><div class="ico" id="sti">{{i:loader-circle:lg}}</div><h1 id="stt">Connexion…</h1><p id="msg"></p>
 <div class="acts" id="sta" hidden><a class="btn s" href="/help">{{i:life-buoy}}Besoin d'aide ?</a></div></div></div>
<div class="bar off" id="bar" role="toolbar" aria-label="Commandes du lecteur">
 <button class="btn" id="ctl" type="button" hidden aria-pressed="false">{{i:mouse-pointer-2}}<span>Contrôler</span></button>
 <button class="btn" id="kb" type="button" hidden aria-label="Clavier">{{i:keyboard}}<span>Clavier</span></button>
 <button class="btn" id="snd" type="button" aria-pressed="false" aria-label="Activer le son (M)">{{i:volume-x}}<span>Activer le son</span></button>
 <button class="btn" id="fs" type="button" aria-label="Plein écran (F)">{{i:maximize}}<span>Plein écran</span></button>
 <span class="sep" aria-hidden="true"></span><span class="stats" id="info" aria-label="Qualité du flux"></span>
 <a class="btn hlp" href="/help" aria-label="Aide">{{i:circle-help}}<span>Aide</span></a></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ctlhint" id="chint" hidden>{{i:mouse-pointer-click}}Contrôle actif · Ctrl+Alt+Maj+Q pour quitter</div>
<div class="kbp" id="kbp" hidden><input id="kbd" type="text" placeholder="Écris ici pour taper sur le PC" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Texte à envoyer au PC"></div>
<script src="/web/shared.js"></script>
<script>
const ID=Math.random().toString(36).slice(2)+Date.now().toString(36);
const $=id=>document.getElementById(id),v=$('v'),bar=$('bar');let pc=null,myIp='',timer,hideT,playing=false;
function say(title,msg,icon,spin,help){$('st').hidden=!title;$('stt').textContent=title||'';$('msg').textContent=msg||'';
  $('sti').innerHTML=ic(icon||'loader-circle','lg'+(spin?' spin':''));$('sta').hidden=!help;$('live-msg').textContent=title||'Connecté';}
function wake(){bar.classList.remove('off');clearTimeout(hideT);if(playing)hideT=setTimeout(()=>{if(!bar.contains(document.activeElement))bar.classList.add('off');},3500);}
['pointermove','pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,wake,{passive:true}));bar.addEventListener('focusin',wake);
function closePc(){clearInterval(timer);if(pc){pc.close();pc=null;}v.srcObject=null;$('info').textContent='';playing=false;wake();}
async function onOffer(m){
  closePc();say('Connexion au PC…','Établissement de la liaison directe.','loader-circle',true);
  pc=new RTCPeerConnection({iceServers:[]});const me=pc;
  pc.ontrack=e=>{if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0];try{e.receiver.jitterBufferTarget=50;}catch(_){}};
  pc.onconnectionstatechange=()=>{if(me!==pc)return;
    if(pc.connectionState==='connected'){say('');playing=true;v.play().catch(()=>{});wake();}
    else if(['failed','disconnected'].includes(pc.connectionState)){playing=false;say('Connexion perdue','Nouvelle tentative en cours…','wifi-off',false,true);}};
  await pc.setRemoteDescription({type:'offer',sdp:m.sdp});
  await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
  post({role:'viewer',id:ID,type:'answer',sdp:boostSdp(fixSdp(pc.localDescription.sdp,myIp))});
  let lb=0,lt=0;timer=setInterval(async()=>{if(!pc)return;const st=await pc.getStats();for(const r of st.values())
    if(r.type==='inbound-rtp'&&r.kind==='video'){const now=performance.now(),mb=lt?((r.bytesReceived-lb)*8/1e6)/((now-lt)/1000):0;lb=r.bytesReceived;lt=now;
      const c=r.codecId&&st.get(r.codecId)?st.get(r.codecId).mimeType.replace('video/',''):'';window.__stats=Object.assign({},r,{mb,codec:c});
      $('info').textContent=(r.frameWidth||'?')+'×'+(r.frameHeight||'?')+' · '+Math.round(r.framesPerSecond||0)+' i/s · '+mb.toFixed(1)+' Mb/s · '+c;}},1000);
}
const es=new EventSource('/events?role=viewer&id='+ID);
es.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==='hello'){myIp=m.ip;setCtlAvail(!!m.control);m.sender?say('Connexion au PC…','','loader-circle',true):say('En attente du partage','Le PC n\'a pas encore démarré le partage. Cette page se connectera toute seule.','hourglass',false,true);}
  else if(m.type==='offer')onOffer(m);
  else if(m.type==='control-available')setCtlAvail(m.on);
  else if(m.type==='control')onControl(m);
  else if(m.type==='sender-left'){stopControl();setCtlAvail(false);closePc();say('Le partage est terminé','En attente d\'un nouveau partage…','monitor',false,true);}};
es.onerror=()=>{stopControl();playing=false;say('Connexion au PC perdue','Nouvelle tentative…','wifi-off',false,true);};
function setMuted(m){v.muted=m;v.play().catch(()=>{});const b=$('snd');b.setAttribute('aria-pressed',String(!m));
  b.innerHTML=ic(m?'volume-x':'volume-2')+'<span>'+(m?'Activer le son':'Son activé')+'</span>';b.setAttribute('aria-label',m?'Activer le son (M)':'Couper le son (M)');}
function fs(){const d=document;if(d.fullscreenElement){d.exitFullscreen();}else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();}
$('snd').onclick=()=>setMuted(!v.muted);$('fs').onclick=fs;v.ondblclick=fs;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('a,button')&&e.key!=='f'&&e.key!=='m')return;
  if(e.key==='f'||e.key==='F')fs();else if(e.key==='m'||e.key==='M')setMuted(!v.muted);});
document.addEventListener('fullscreenchange',()=>{$('fs').innerHTML=ic(document.fullscreenElement?'minimize':'maximize')+'<span>'+(document.fullscreenElement?'Quitter':'Plein écran')+'</span>';});

/* ================= Contrôle à distance ================= */
let ctlAvail=false,ctlState='off',ctlPend,seq=0,out=[],busy=false,held=new Set(),mvQ=null,raf=0;
function toast(t,icon){const el=$('toast');el.innerHTML=ic(icon||'info')+'<span></span>';el.lastChild.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,4500);$('live-msg').textContent=t;}
function setCtlAvail(on){ctlAvail=!!on;$('ctl').hidden=!ctlAvail&&ctlState==='off';if(!ctlAvail&&ctlState!=='off')stopControl('disabled');}
function ctlBtn(){const b=$('ctl'),st=ctlState;b.setAttribute('aria-pressed',String(st==='on'));b.disabled=st==='pending';
  b.innerHTML=ic(st==='pending'?'loader-circle':'mouse-pointer-2',st==='pending'?'spin':'')+'<span>'+({off:'Contrôler',pending:'En attente du PC…',on:'Quitter le contrôle'})[st]+'</span>';
  b.setAttribute('aria-label',st==='on'?'Quitter le contrôle':'Demander le contrôle du PC');}
$('ctl').onclick=async()=>{
  if(ctlState==='on'){await fetch('/control/release',{method:'POST',body:JSON.stringify({id:ID})}).catch(()=>{});stopControl('released');return;}
  ctlState='pending';ctlBtn();
  const r=await fetch('/control/request',{method:'POST',body:JSON.stringify({id:ID})}).catch(()=>null);
  if(!r||!r.ok){ctlState='off';ctlBtn();toast('Le contrôle n\'est pas disponible.','circle-x');return;}
  clearTimeout(ctlPend);ctlPend=setTimeout(()=>{if(ctlState==='pending'){ctlState='off';ctlBtn();toast('Le PC n\'a pas répondu à ta demande.','hourglass');}},60000);};
function onControl(m){clearTimeout(ctlPend);
  if(m.granted){ctlState='on';startControl();}
  else{const was=ctlState;stopControl(m.reason,was);}}
const REASON={denied:'Le PC a refusé le contrôle.',revoked:'Le PC a repris la main.',disabled:'Le contrôle a été désactivé sur le PC.',replaced:'Un autre appareil a pris le contrôle.',left:'Contrôle terminé.',released:'Contrôle terminé.',sender:'Le partage est terminé.'};
function startControl(){ctlBtn();document.body.classList.add('ctl');$('bar').classList.add('compact');$('bar').classList.remove('off');$('kb').hidden=false;$('chint').hidden=false;
  toast('Contrôle accordé : tu peux utiliser la souris et le clavier.','circle-check');}
function stopControl(reason,was){const had=ctlState!=='off';releaseAll();ctlState='off';clearTimeout(ctlPend);ctlBtn();document.body.classList.remove('ctl');
  $('bar').classList.remove('compact');$('kb').hidden=true;$('kbp').hidden=true;$('chint').hidden=true;$('ctl').hidden=!ctlAvail;
  if(had&&reason&&REASON[reason])toast(REASON[reason],reason==='denied'?'circle-x':'info');}
/* envoi : un seul lot en vol, mouvements fusionnés */
function send(e){if(ctlState!=='on')return;if(e.t==='m'&&out.length&&out[out.length-1].t==='m')out[out.length-1]=e;else out.push(e);flush();}
async function flush(){if(busy||!out.length)return;busy=true;const ev=out.splice(0,100);
  try{await fetch('/input',{method:'POST',body:JSON.stringify({id:ID,seq:++seq,ev})});}catch(_){}
  busy=false;if(out.length)flush();}
function pos(e){const r=v.getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const s=Math.min(r.width/vw,r.height/vh),w=vw*s,h=vh*s,ox=r.left+(r.width-w)/2,oy=r.top+(r.height-h)/2;
  return {x:(e.clientX-ox)/w,y:(e.clientY-oy)/h};}
const inside=p=>p&&p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1,clamp=p=>({x:Math.min(1,Math.max(0,p.x)),y:Math.min(1,Math.max(0,p.y))});
let touch=null;
v.addEventListener('pointermove',e=>{if(ctlState!=='on')return;const p=pos(e);if(!p)return;
  if(e.pointerType==='touch'){if(!touch)return;const d=Math.hypot(e.clientX-touch.sx,e.clientY-touch.sy);
    if(!touch.drag&&d>8){touch.drag=true;clearTimeout(touch.lp);const q=clamp(touch.p);send({t:'b',b:0,d:true,x:q.x,y:q.y});}
    if(touch.drag){const q=clamp(p);send({t:'m',x:q.x,y:q.y});}return;}
  if(inside(p))send({t:'m',x:p.x,y:p.y});});
v.addEventListener('pointerdown',e=>{if(ctlState!=='on')return;const p=pos(e);if(!p||!inside(p))return;e.preventDefault();try{v.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='touch'){touch={sx:e.clientX,sy:e.clientY,p,drag:false,right:false};
    touch.lp=setTimeout(()=>{if(touch&&!touch.drag){touch.right=true;send({t:'m',x:p.x,y:p.y});send({t:'b',b:2,d:true,x:p.x,y:p.y});send({t:'b',b:2,d:false,x:p.x,y:p.y});}},550);return;}
  send({t:'b',b:e.button,d:true,x:p.x,y:p.y});});
v.addEventListener('pointerup',e=>{if(ctlState!=='on')return;const p=clamp(pos(e)||{x:0,y:0});
  if(e.pointerType==='touch'){if(!touch)return;clearTimeout(touch.lp);
    if(touch.drag)send({t:'b',b:0,d:false,x:p.x,y:p.y});
    else if(!touch.right){const q=touch.p;send({t:'m',x:q.x,y:q.y});send({t:'b',b:0,d:true,x:q.x,y:q.y});send({t:'b',b:0,d:false,x:q.x,y:q.y});}
    touch=null;return;}
  send({t:'b',b:e.button,d:false,x:p.x,y:p.y});});
v.addEventListener('pointercancel',()=>{if(touch&&touch.drag)send({t:'b',b:0,d:false});if(touch)clearTimeout(touch.lp);touch=null;});
v.addEventListener('contextmenu',e=>{if(ctlState==='on')e.preventDefault();});
v.addEventListener('wheel',e=>{if(ctlState!=='on')return;e.preventDefault();const k=e.deltaMode===1?1:e.deltaMode===2?10:1/100;
  send({t:'w',dx:e.deltaX*k,dy:e.deltaY*k});},{passive:false});
/* clavier */
function kev(e,d){const altgr=e.getModifierState&&e.getModifierState('AltGraph');
  return {t:'k',d,key:e.key,code:e.code,ctrl:e.ctrlKey&&!altgr,alt:e.altKey&&!altgr,meta:e.metaKey,shift:e.shiftKey};}
addEventListener('keydown',e=>{if(ctlState!=='on')return;
  if(e.ctrlKey&&e.altKey&&e.shiftKey&&e.code==='KeyQ'){e.preventDefault();e.stopImmediatePropagation();$('ctl').click();return;}
  const inField=e.target===$('kbd');if(inField&&(e.key.length===1||e.key==='Unidentified'||e.isComposing))return;
  e.preventDefault();e.stopImmediatePropagation();held.add(e.key);send(kev(e,true));},true);
addEventListener('keyup',e=>{if(ctlState!=='on')return;const inField=e.target===$('kbd');if(inField&&(e.key.length===1||e.key==='Unidentified'||e.isComposing))return;
  e.preventDefault();e.stopImmediatePropagation();held.delete(e.key);send(kev(e,false));},true);
function releaseAll(){held.forEach(k=>send({t:'k',d:false,key:k}));held.clear();if(touch){clearTimeout(touch.lp);touch=null;}}
addEventListener('blur',releaseAll);
addEventListener('pagehide',()=>{if(ctlState==='on')navigator.sendBeacon('/control/release',JSON.stringify({id:ID}));});
$('kb').onclick=()=>{$('kbp').hidden=!$('kbp').hidden;if(!$('kbp').hidden)$('kbd').focus();};
$('kbd').addEventListener('input',e=>{if(e.isComposing)return;const s=$('kbd').value;$('kbd').value='';if(s)send({t:'s',s});});
$('kbd').addEventListener('compositionend',()=>{const s=$('kbd').value;$('kbd').value='';if(s)send({t:'s',s});});
</script></body></html>
